<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시간 계산</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-labelledby="app-title">
        <header class="app-header">
          <div>
            <p id="currentFormatText" class="eyebrow">형식: DDMMYY HHMM</p>
            <h1 id="app-title">시간 계산</h1>
          </div>
          <button id="clearButton" class="icon-button" type="button" title="초기화" aria-label="초기화">
            ↺
          </button>
        </header>

        <section class="format-selector" aria-labelledby="format-title">
          <div>
            <p id="format-title">날짜 형식</p>
            <p class="format-helper">입력할 날짜 순서를 선택하세요.</p>
          </div>
          <div class="segmented-control" role="radiogroup" aria-label="날짜 형식">
            <label>
              <input type="radio" name="dateFormat" value="DDMMYY" checked />
              <span>DDMMYY <small>HHMM</small></span>
            </label>
            <label>
              <input type="radio" name="dateFormat" value="YYMMDD" />
              <span>YYMMDD <small>HHMM</small></span>
            </label>
            <label>
              <input type="radio" name="dateFormat" value="YYYYMMDD" />
              <span>YYYYMMDD <small>HHMM</small></span>
            </label>
          </div>
        </section>

        <div class="quick-entry">
          <div class="label-row">
            <label for="quickInput">한 줄 입력</label>
            <span id="quickFormatPill" class="format-pill">시작 / 종료</span>
          </div>
          <input
            id="quickInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="230526 1743 / 260526 1035"
          />
        </div>

        <div class="field-grid">
          <label class="field-card" for="startInput">
            <span class="label-row">
              <span>시작</span>
              <span id="startFormatPill" class="format-pill">DDMMYY HHMM</span>
            </span>
            <input
              id="startInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              maxlength="11"
              placeholder="예: 230526 1743"
            />
            <output id="startPreview">인식 대기</output>
          </label>

          <div class="field-card">
            <label class="label-row" for="endInput">
              <span>종료</span>
              <span id="endFormatPill" class="format-pill">DDMMYY HHMM</span>
            </label>
            <input
              id="endInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              maxlength="11"
              placeholder="예: 260526 1035"
              aria-describedby="endPreview"
            />
            <div class="day-controls" role="group" aria-label="종료 날짜 조정">
              <button id="endMinusDay" type="button" aria-label="종료 날짜 하루 감소" title="종료 날짜 하루 감소" disabled>day -1</button>
              <button id="endPlusDay" type="button" aria-label="종료 날짜 하루 증가" title="종료 날짜 하루 증가" disabled>day +1</button>
            </div>
            <output id="endPreview">인식 대기</output>
          </div>
        </div>

        <section class="result-panel" aria-live="polite">
          <div>
            <p>총 시간</p>
            <output id="resultText">--</output>
          </div>
          <button id="copyButton" type="button" disabled>복사</button>
        </section>

        <p id="statusText" class="status-text" role="status"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
